<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>heph run</title>
<style>
:root{--bg:#fff;--fg:#1c1c1c;--muted:#6b6b6b;--card:#f6f6f4;--line:#dcdcd6;--ok:#1a7f37;--warn:#9a6700;--bad:#cf222e;--run:#0969da;color-scheme:light dark}
:root[data-theme=dark]{--bg:#1f1f1e;--fg:#ececec;--muted:#a0a09a;--card:#2a2a28;--line:#3e3e3a;--ok:#3fb950;--warn:#d29922;--bad:#f85149;--run:#58a6ff}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1f1f1e;--fg:#ececec;--muted:#a0a09a;--card:#2a2a28;--line:#3e3e3a;--ok:#3fb950;--warn:#d29922;--bad:#f85149;--run:#58a6ff}}
body{margin:0;padding:14px;font:14px/1.45 var(--font-sans,system-ui,sans-serif);background:var(--color-background-primary,var(--bg));color:var(--color-text-primary,var(--fg))}
.muted,.meta,.stack,.note,th{color:var(--color-text-secondary,var(--muted))}
.head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.ids{font-weight:600;overflow-wrap:anywhere;margin-right:auto}
.badge,.status{padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid currentColor;white-space:nowrap}
.ok{color:var(--ok)}.wait{color:var(--warn)}.bad{color:var(--bad)}.run{color:var(--run)}
.refresh{font:inherit;font-size:12px;padding:2px 10px;border-radius:6px;border:1px solid var(--color-border-primary,var(--line));background:var(--color-background-secondary,var(--card));color:inherit;cursor:pointer}
.refresh:disabled{opacity:.6;cursor:default}
.banner{margin:0 0 10px;padding:8px 12px;border:1px solid var(--warn);border-left-width:4px;border-radius:6px;background:var(--color-background-secondary,var(--card))}
.cmd{font-family:ui-monospace,monospace;overflow-wrap:anywhere}
.error{margin:0 0 10px;padding:6px 10px;border:1px solid var(--bad);border-radius:6px;color:var(--bad);overflow-wrap:anywhere}
.stale{margin:0 0 10px;color:var(--warn)}.stack{margin:0 0 10px}
.h{font-size:12px;text-transform:uppercase;letter-spacing:.04em;margin:14px 0 6px;color:var(--color-text-secondary,var(--muted))}
.layers{display:flex;gap:14px;align-items:flex-start;overflow-x:auto;padding-bottom:6px}
.layer{display:flex;flex-direction:column;gap:8px;flex:0 0 230px;min-width:0}
.ulist{display:flex;flex-direction:column;gap:8px}
.unit{padding:7px 10px;border:1px solid var(--color-border-primary,var(--line));border-radius:8px;background:var(--color-background-secondary,var(--card))}
.unit.bad{border-color:var(--bad)}.unit.run{border-color:var(--run)}
.unit-top{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;cursor:pointer}
.unit-id{font-family:ui-monospace,monospace;font-size:12px;opacity:.8}.unit-title{font-weight:600;overflow-wrap:anywhere;flex:1 1 100%;order:3}
.status{font-size:11px;margin-left:auto}
.meta,.after{font-size:12px;margin-top:2px}.after{color:var(--color-text-secondary,var(--muted))}
.attempt{margin-top:6px;padding-top:6px;border-top:1px solid var(--color-border-primary,var(--line));font-size:12px}
.attempt-line{overflow-wrap:anywhere}.gate{margin:2px 0 0 8px;overflow-wrap:anywhere}
ul{margin:2px 0 0;padding-left:18px}.item{overflow-wrap:anywhere}.evidence{font-family:ui-monospace,monospace;color:var(--color-text-secondary,var(--muted))}
table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:3px 10px 3px 0;font-size:13px;overflow-wrap:anywhere}th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;font-weight:500}.num{text-align:right;font-variant-numeric:tabular-nums}
.pr{color:var(--run)}
.fallback{white-space:pre-wrap;overflow-wrap:anywhere;margin:0;font:inherit}
</style></head>
<body></body>
<script>/*SCRIPT*/</script>
</html>
